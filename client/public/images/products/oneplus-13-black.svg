<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <linearGradient id="bodyBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26272b" />
      <stop offset="50%" stop-color="#191a1d" />
      <stop offset="100%" stop-color="#0d0e10" />
    </linearGradient>
    <linearGradient id="frameBlack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f4147" />
      <stop offset="50%" stop-color="#232428" />
      <stop offset="100%" stop-color="#3f4147" />
    </linearGradient>
    <radialGradient id="camDial" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#22242a" />
      <stop offset="85%" stop-color="#121316" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </radialGradient>
    <radialGradient id="lensGlass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGlow)" />

  <!-- Phone Body -->
  <g filter="url(#shadow)">
    <!-- Frame -->
    <rect x="220" y="100" width="360" height="800" rx="36" fill="url(#frameBlack)" stroke="#475569" stroke-width="2" />
    <!-- Rear Silk Glass -->
    <rect x="226" y="106" width="348" height="788" rx="32" fill="url(#bodyBlack)" />
    <!-- Soft Matte Gradient -->
    <path d="M 226 106 L 574 380 L 574 788 L 226 514 Z" fill="white" opacity="0.03" />
  </g>

  <!-- OnePlus 13 Iconic Circular Camera Deco -->
  <g transform="translate(320, 260)">
    <!-- Outer Metal Accent Ring -->
    <circle cx="60" cy="60" r="105" fill="url(#camDial)" stroke="#475569" stroke-width="4" filter="url(#shadow)" />
    <circle cx="60" cy="60" r="96" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
    
    <!-- Camera 1 -->
    <circle cx="25" cy="25" r="28" fill="#1e2025" stroke="#334155" stroke-width="2" />
    <circle cx="25" cy="25" r="22" fill="url(#lensGlass)" />
    <circle cx="22" cy="22" r="6" fill="#38bdf8" opacity="0.4" />
    
    <!-- Camera 2 -->
    <circle cx="95" cy="25" r="28" fill="#1e2025" stroke="#334155" stroke-width="2" />
    <circle cx="95" cy="25" r="22" fill="url(#lensGlass)" />
    <circle cx="92" cy="22" r="6" fill="#38bdf8" opacity="0.4" />

    <!-- Camera 3 -->
    <circle cx="25" cy="95" r="28" fill="#1e2025" stroke="#334155" stroke-width="2" />
    <circle cx="25" cy="95" r="22" fill="url(#lensGlass)" />
    <circle cx="22" cy="92" r="6" fill="#38bdf8" opacity="0.4" />

    <!-- Flash / Hasselblad Branding -->
    <circle cx="95" cy="95" r="20" fill="#1e2025" />
    <circle cx="95" cy="95" r="12" fill="#fef08a" opacity="0.9" />
    <text x="60" y="65" font-family="serif" font-size="16" font-style="italic" font-weight="bold" fill="#94a3b8" text-anchor="middle">H</text>
  </g>

  <!-- OnePlus 1+ Logo at Center Bottom -->
  <g transform="translate(380, 720)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="none" stroke="#64748b" stroke-width="3" />
    <text x="14" y="27" font-family="sans-serif" font-size="20" font-weight="bold" fill="#64748b">1</text>
    <text x="28" y="16" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ef4444">+</text>
  </g>
</svg>
