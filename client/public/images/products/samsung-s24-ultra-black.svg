<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <linearGradient id="bodyBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2b2f" />
      <stop offset="50%" stop-color="#18191c" />
      <stop offset="100%" stop-color="#0f1012" />
    </linearGradient>
    <linearGradient id="frameBlack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a4d53" />
      <stop offset="15%" stop-color="#2e3035" />
      <stop offset="85%" stop-color="#2e3035" />
      <stop offset="100%" stop-color="#4a4d53" />
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555861" />
      <stop offset="100%" stop-color="#1e2024" />
    </linearGradient>
    <radialGradient id="lensGlass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a5f" />
      <stop offset="40%" stop-color="#0a192f" />
      <stop offset="80%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>
  
  <rect width="800" height="1000" fill="url(#bgGlow)" />
  
  <!-- Shadow & Phone Body -->
  <g filter="url(#shadow)">
    <!-- Titanium Frame -->
    <rect x="210" y="100" width="380" height="800" rx="28" fill="url(#frameBlack)" stroke="#475569" stroke-width="2" />
    <!-- Rear Glass Panel -->
    <rect x="216" y="106" width="368" height="788" rx="24" fill="url(#bodyBlack)" />
    <!-- Matte Sheen -->
    <path d="M 216 106 L 584 400 L 584 788 L 216 494 Z" fill="white" opacity="0.02" />
  </g>

  <!-- Samsung S24 Ultra Iconic Vertical Camera Layout -->
  <!-- Main Camera 1 -->
  <g transform="translate(260, 160)">
    <circle cx="45" cy="45" r="42" fill="url(#lensRing)" stroke="#3b3e45" stroke-width="3" />
    <circle cx="45" cy="45" r="34" fill="url(#lensGlass)" />
    <circle cx="45" cy="45" r="22" fill="#030712" />
    <circle cx="36" cy="36" r="8" fill="#38bdf8" opacity="0.4" />
    <circle cx="40" cy="38" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Main Camera 2 -->
  <g transform="translate(260, 270)">
    <circle cx="45" cy="45" r="42" fill="url(#lensRing)" stroke="#3b3e45" stroke-width="3" />
    <circle cx="45" cy="45" r="34" fill="url(#lensGlass)" />
    <circle cx="45" cy="45" r="22" fill="#030712" />
    <circle cx="36" cy="36" r="8" fill="#38bdf8" opacity="0.4" />
    <circle cx="40" cy="38" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Main Camera 3 (Periscope Telephoto) -->
  <g transform="translate(260, 380)">
    <circle cx="45" cy="45" r="42" fill="url(#lensRing)" stroke="#3b3e45" stroke-width="3" />
    <circle cx="45" cy="45" r="34" fill="url(#lensGlass)" />
    <rect x="33" y="33" width="24" height="24" rx="5" fill="#030712" />
    <circle cx="40" cy="38" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Secondary Column (Flash & Laser Sensor) -->
  <g transform="translate(375, 175)">
    <!-- Laser AF Sensor -->
    <circle cx="20" cy="20" r="18" fill="url(#lensRing)" />
    <circle cx="20" cy="20" r="13" fill="#0f172a" />
    <circle cx="18" cy="18" r="4" fill="#ef4444" opacity="0.6" />
    <!-- LED Flash -->
    <circle cx="20" cy="85" r="16" fill="url(#lensRing)" />
    <circle cx="20" cy="85" r="11" fill="#fef08a" opacity="0.9" />
    <circle cx="20" cy="85" r="5" fill="#ffffff" />
    <!-- 3x Telephoto Lens -->
    <circle cx="20" cy="150" r="24" fill="url(#lensRing)" />
    <circle cx="20" cy="150" r="18" fill="url(#lensGlass)" />
    <circle cx="16" cy="146" r="2" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Samsung Logo at Bottom -->
  <text x="400" y="830" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" letter-spacing="7" fill="#64748b" text-anchor="middle">SAMSUNG</text>
</svg>
